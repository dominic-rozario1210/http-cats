<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTTP Cats</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">

        <h1>HTTP Cats 🐱</h1>

        <div class="input">
            <input
                id="statusInput"
                type="number"
                placeholder="Enter status code"
            >

            <button id="statusBtn" type="button">
                Search
            </button>
        </div>

        <p id="message"></p>

        <div class="image">
            <img
                id="catImage"
                src="https://http.cat/200"
                alt="HTTP 200 status cat"
            >
        </div>

    </div>

    <script src="./script.js"></script>

</body>

</html>
